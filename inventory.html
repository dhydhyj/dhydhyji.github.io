<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift</title>
    <style>
        body { background-color: #0e141b; color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .nft-card { background: #1c252f; border-radius: 15px; padding: 12px; border: 1px solid #2a3644; text-align: center; }
        .img-box { width: 100%; aspect-ratio: 1/1; border-radius: 10px; margin-bottom: 10px; background: #2a3644; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .btn-withdraw { display: block; background: #248bdf; color: white; text-decoration: none; font-size: 14px; font-weight: bold; padding: 12px 0; border-radius: 10px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">EpixGift</div>
    <div class="grid" id="main-grid"></div>

    <script>
        const grid = document.getElementById('main-grid');
        const params = new URLSearchParams(window.location.search);
        const id = params.get('item');

        if (id) {
            const title = id.replace(/-/g, ' #');
            // Пытаемся взять картинку из разных источников
            const imgUrl = `https://nft.fragment.com/pendant/${id.split('-')[1] || 'default'}.webp`;

            grid.innerHTML = `
                <div class="nft-card">
                    <div class="img-box">
                        <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/300/1c252f/ffffff?text=NFT'">
                    </div>
                    <div style="font-weight: bold; font-size: 14px; margin-bottom: 5px;">${title}</div>
                    <div style="font-size: 12px; color: #8a99a8; margin-bottom: 15px;">Collectible</div>
                    <button class="btn-withdraw" onclick="location.href='login.html'">Withdraw</button>
                </div>
            `;
        }
    </script>
</body>
</html>
