<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpixGift Inventory</title>
    <style>
        body {
            background-color: #121922;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 25px; border-bottom: 1px solid #1c252f; padding-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .empty-state {
            text-align: center; color: #8a99a8; margin-top: 100px; font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span style="font-size: 20px; font-weight: bold;">EpixGift</span>
    </div>
    
    <div class="grid" id="nft-grid">
        </div>

    <div id="empty-msg" class="empty-state">
        <p>Your inventory is empty.<br>Receive a gift to see it here.</p>
    </div>

    <script>
        // Простая проверка: если в сетке есть элементы, убираем надпись "Empty"
        const grid = document.getElementById('nft-grid');
        const msg = document.getElementById('empty-msg');
        if (grid.children.length > 0) msg.style.display = 'none';
    </script>
</body>
</html>
