<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing...</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%; max-width: 340px; text-align: center; padding: 20px;
        }
        /* Анимированный спиннер в стиле Telegram */
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #0088cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { font-size: 24px; margin-bottom: 15px; font-weight: 600; }
        p { color: #8e8e93; font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
        .timer {
            color: #0088cc; font-weight: bold; font-size: 14px; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Processing your gift...</h2>
        <p>Thanks for choosing <b>EpixGift</b>!<br>
        Please don't close this page or the Telegram bot until you receive a confirmation notification.</p>
        <p style="font-size: 14px; color: #636366;">This usually takes about 20 to 30 seconds.</p>
        <div class="timer" id="countdown">Estimated time: 25s</div>
    </div>

    <script>
        // Простой обратный отсчет для визуального эффекта
        let seconds = 25;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            countdownEl.innerText = `Estimated time: ${seconds}s`;
            if (seconds <= 3) {
                clearInterval(timer);
                countdownEl.innerText = "Almost done...";
            }
        }, 1000);

        // Через 30 секунд можно автоматически перенаправить в инвентарь
        setTimeout(() => {
            window.location.href = "inventory.html";
        }, 30000);
    </script>
</body>
</html>
