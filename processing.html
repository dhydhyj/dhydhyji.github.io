<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #0e141b; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding: 60px 20px; }
        .spinner { margin: 40px auto; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #248bdf; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 24px; margin-bottom: 15px; }
        p { color: #8a99a8; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Processing Transfer...</h2>
    <p>We are verifying your ownership and preparing the NFT for withdrawal. This may take a few minutes.</p>
    <p style="font-size: 13px; margin-top: 20px;">Please do not close this window.</p>
</body>
</html>
